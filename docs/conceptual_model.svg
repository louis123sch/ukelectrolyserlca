<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="800" viewBox="0 0 760 800" role="img" aria-label="One busbar: the optimiser sizes every box once and runs it hour by hour" font-size="13" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="cm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5F5E5A"/></marker><marker id="cm-h2-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E0662F"/></marker><marker id="cm-gas-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1E9E6A"/></marker></defs><rect x="0" y="0" width="760" height="800" fill="#FFFFFF"/><text x="24" y="28" font-size="15" fill="#1F1E1D" font-weight="600">One busbar: the optimiser sizes every box once and runs it hour by hour</text><text x="24" y="48" font-size="11.5" fill="#5F5E5A">Inside the dashed line: what the optimiser may build (each sized once, zero allowed). Every arrow is set hour by hour.</text><g ><rect x="192" y="64" width="544" height="504" rx="12" fill="none" stroke="#5F5E5A" stroke-width="1.25" stroke-dasharray="8 5"/><text x="208" y="86" font-size="11.5" fill="#5F5E5A" font-weight="600">Site boundary: built, costed and counted for carbon</text></g><g ><rect x="220.0" y="100" width="180" height="56" rx="8" fill="none" stroke="#5F5E5A" stroke-width="1.25"/><text x="310" y="124" font-size="13" fill="#1F1E1D" text-anchor="middle" font-weight="600">Onshore wind</text><text x="310" y="140" font-size="11.5" fill="#5F5E5A" text-anchor="middle">output set by weather</text></g><g ><rect x="220.0" y="172" width="180" height="56" rx="8" fill="none" stroke="#5F5E5A" stroke-width="1.25"/><text x="310" y="196" font-size="13" fill="#1F1E1D" text-anchor="middle" font-weight="600">Ground-mounted solar</text><text x="310" y="212" font-size="11.5" fill="#5F5E5A" text-anchor="middle">output set by weather</text></g><g ><rect x="220.0" y="244" width="180" height="56" rx="8" fill="none" stroke="#5F5E5A" stroke-width="1.25"/><text x="310" y="268" font-size="13" fill="#1F1E1D" text-anchor="middle" font-weight="600">Grid connection</text><text x="310" y="284" font-size="11.5" fill="#5F5E5A" text-anchor="middle">size + price list chosen</text></g><g ><rect x="220.0" y="316" width="180" height="56" rx="8" fill="none" stroke="#5F5E5A" stroke-width="1.25"/><text x="310" y="340" font-size="13" fill="#1F1E1D" text-anchor="middle" font-weight="600">Gas engines</text><text x="310" y="356" font-size="11.5" fill="#5F5E5A" text-anchor="middle">optional, off by default</text></g><g ><rect x="220.0" y="388" width="180" height="56" rx="8" fill="none" stroke="#5F5E5A" stroke-width="1.25"/><text x="310" y="412" font-size="13" fill="#1F1E1D" text-anchor="middle" font-weight="600">Fuel cell</text><text x="310" y="428" font-size="11.5" fill="#5F5E5A" text-anchor="middle">hydrogen to power</text></g><g ><rect x="510.0" y="92" width="200" height="72" rx="8" fill="#2F6FD0" fill-opacity="0.12" stroke="#2F6FD0" stroke-width="2"/><text x="610" y="116" font-size="13" fill="#1F1E1D" text-anchor="middle" font-weight="600">Data centre</text><text x="610" y="132" font-size="11.5" fill="#5F5E5A" text-anchor="middle">flat load: IT × PUE</text><text x="610" y="148" font-size="11.5" fill="#5F5E5A" text-anchor="middle">100 MW IT → 140 MW</text></g><g ><rect x="510.0" y="208" width="200" height="56" rx="8" fill="none" stroke="#5F5E5A" stroke-width="1.25"/><text x="610" y="232" font-size="13" fill="#1F1E1D" text-anchor="middle" font-weight="600">Battery</text><text x="610" y="248" font-size="11.5" fill="#5F5E5A" text-anchor="middle">charges and discharges</text></g><g ><rect x="510.0" y="316" width="200" height="56" rx="8" fill="none" stroke="#5F5E5A" stroke-width="1.25"/><text x="610" y="340" font-size="13" fill="#1F1E1D" text-anchor="middle" font-weight="600">Electrolyser</text><text x="610" y="356" font-size="11.5" fill="#5F5E5A" text-anchor="middle">power to hydrogen</text></g><g ><rect x="370.0" y="488" width="160" height="56" rx="8" fill="none" stroke="#5F5E5A" stroke-width="1.25"/><text x="450" y="512" font-size="13" fill="#1F1E1D" text-anchor="middle" font-weight="600">Hydrogen tank</text><text x="450" y="528" font-size="11.5" fill="#5F5E5A" text-anchor="middle">steel, 28 bar</text></g><g ><line x1="450" y1="100" x2="450" y2="444" stroke="#1F1E1D" stroke-width="4"/><text x="450" y="464" font-size="11.5" fill="#5F5E5A" text-anchor="middle" font-weight="600">site busbar</text></g><g ><rect x="24.0" y="136" width="152" height="56" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/><text x="100" y="160" font-size="13" fill="#1F1E1D" text-anchor="middle" font-weight="600">Weather, 2025</text><text x="100" y="176" font-size="11.5" fill="#5F5E5A" text-anchor="middle">wind and sun, hourly</text></g><g ><rect x="24.0" y="244" width="152" height="56" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/><text x="100" y="268" font-size="13" fill="#1F1E1D" text-anchor="middle" font-weight="600">GB grid</text><text x="100" y="284" font-size="11.5" fill="#5F5E5A" text-anchor="middle">price, carbon hourly</text></g><g ><rect x="24.0" y="316" width="152" height="56" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/><text x="100" y="340" font-size="13" fill="#1F1E1D" text-anchor="middle" font-weight="600">Gas network</text><text x="100" y="356" font-size="11.5" fill="#5F5E5A" text-anchor="middle">gas + carbon price</text></g><g ><rect x="24.0" y="496" width="152" height="56" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/><text x="100" y="520" font-size="13" fill="#1F1E1D" text-anchor="middle" font-weight="600">Hydrogen seller</text><text x="100" y="536" font-size="11.5" fill="#5F5E5A" text-anchor="middle">green, as needed</text></g><g ><path d="M176.0 164H204V128H220.0" fill="none" stroke="#5F5E5A" stroke-width="1.25" marker-end="url(#cm-arrow)"/><path d="M204 164V200H220.0" fill="none" stroke="#5F5E5A" stroke-width="1.25" marker-end="url(#cm-arrow)"/><path d="M176.0 272H220.0" fill="none" stroke="#5F5E5A" stroke-width="1.25" marker-end="url(#cm-arrow)"/><path d="M176.0 344H220.0" fill="none" stroke="#1E9E6A" stroke-width="1.5" marker-end="url(#cm-gas-arrow)" stroke-dasharray="2 3"/><path d="M400.0 128H448" fill="none" stroke="#5F5E5A" stroke-width="1.25" marker-end="url(#cm-arrow)"/><path d="M400.0 200H448" fill="none" stroke="#5F5E5A" stroke-width="1.25" marker-end="url(#cm-arrow)"/><path d="M400.0 272H448" fill="none" stroke="#5F5E5A" stroke-width="1.25" marker-end="url(#cm-arrow)"/><path d="M400.0 344H448" fill="none" stroke="#5F5E5A" stroke-width="1.25" marker-end="url(#cm-arrow)"/><path d="M400.0 416H448" fill="none" stroke="#5F5E5A" stroke-width="1.25" marker-end="url(#cm-arrow)"/><path d="M452 128H510.0" fill="none" stroke="#5F5E5A" stroke-width="1.25" marker-end="url(#cm-arrow)"/><path d="M460 236H510.0" fill="none" stroke="#5F5E5A" stroke-width="1.25" marker-end="url(#cm-arrow)" marker-start="url(#cm-arrow)"/><path d="M452 344H510.0" fill="none" stroke="#5F5E5A" stroke-width="1.25" marker-end="url(#cm-arrow)"/><path d="M610 372V516H530" fill="none" stroke="#E0662F" stroke-width="1.5" marker-end="url(#cm-h2-arrow)" stroke-dasharray="6 4"/><path d="M370 508H310V444" fill="none" stroke="#E0662F" stroke-width="1.5" marker-end="url(#cm-h2-arrow)" stroke-dasharray="6 4"/><path d="M176.0 524H370" fill="none" stroke="#E0662F" stroke-width="1.5" marker-end="url(#cm-h2-arrow)" stroke-dasharray="6 4"/></g><text x="300" y="540" font-size="11.5" fill="#5F5E5A" text-anchor="middle">bought</text><text x="618" y="440" font-size="11.5" fill="#5F5E5A">made on site</text><g ><rect x="210.0" y="592" width="240" height="72" rx="8" fill="none" stroke="#5F5E5A" stroke-width="1.25"/><text x="330" y="616" font-size="13" fill="#1F1E1D" text-anchor="middle" font-weight="600">Annual cost</text><text x="330" y="632" font-size="11.5" fill="#5F5E5A" text-anchor="middle">£ per MWh served, 2026 pounds</text><text x="330" y="648" font-size="11.5" fill="#5F5E5A" text-anchor="middle">kit, upkeep, fuel, grid charges</text></g><g ><rect x="470.0" y="592" width="240" height="72" rx="8" fill="none" stroke="#5F5E5A" stroke-width="1.25"/><text x="590" y="616" font-size="13" fill="#1F1E1D" text-anchor="middle" font-weight="600">Life-cycle carbon</text><text x="590" y="632" font-size="11.5" fill="#5F5E5A" text-anchor="middle">g CO2e per kWh served</text><text x="590" y="648" font-size="11.5" fill="#5F5E5A" text-anchor="middle">making the kit, grid, gas, hydrogen</text></g><g ><rect x="270.0" y="688" width="400" height="56" rx="8" fill="none" stroke="#5F5E5A" stroke-width="1.25"/><text x="470" y="712" font-size="13" fill="#1F1E1D" text-anchor="middle" font-weight="600">Front of designs: cheapest → lowest carbon</text><text x="470" y="728" font-size="11.5" fill="#5F5E5A" text-anchor="middle">each point: sizes, hourly running, £/MWh, g/kWh</text></g><g ><rect x="24.0" y="592" width="160" height="120" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/><text x="104" y="616" font-size="13" fill="#1F1E1D" text-anchor="middle" font-weight="600">Left outside</text><text x="104" y="632" font-size="11.5" fill="#5F5E5A" text-anchor="middle">transport to site</text><text x="104" y="648" font-size="11.5" fill="#5F5E5A" text-anchor="middle">standby diesel set</text><text x="104" y="664" font-size="11.5" fill="#5F5E5A" text-anchor="middle">end of life</text><text x="104" y="680" font-size="11.5" fill="#5F5E5A" text-anchor="middle">pipe to gas network</text><text x="104" y="696" font-size="11.5" fill="#5F5E5A" text-anchor="middle">selling power back</text></g><g ><path d="M330 568V592" fill="none" stroke="#5F5E5A" stroke-width="1.25" marker-end="url(#cm-arrow)"/><path d="M590 568V592" fill="none" stroke="#5F5E5A" stroke-width="1.25" marker-end="url(#cm-arrow)"/><path d="M330 664V688" fill="none" stroke="#5F5E5A" stroke-width="1.25" marker-end="url(#cm-arrow)"/><path d="M590 664V688" fill="none" stroke="#5F5E5A" stroke-width="1.25" marker-end="url(#cm-arrow)"/></g><text x="338" y="584" font-size="11.5" fill="#5F5E5A">money</text><text x="598" y="584" font-size="11.5" fill="#5F5E5A">carbon</text><g ><line x1="24" y1="772" x2="56" y2="772" stroke="#5F5E5A" stroke-width="1.25"/><text x="64" y="776" font-size="11.5" fill="#5F5E5A">electricity</text><line x1="160" y1="772" x2="192" y2="772" stroke="#E0662F" stroke-width="1.5" stroke-dasharray="6 4"/><text x="200" y="776" font-size="11.5" fill="#5F5E5A">hydrogen</text><line x1="288" y1="772" x2="320" y2="772" stroke="#1E9E6A" stroke-width="1.5" stroke-dasharray="2 3"/><text x="328" y="776" font-size="11.5" fill="#5F5E5A">natural gas</text><text x="736" y="776" font-size="11.5" fill="#5F5E5A" text-anchor="end">Cost and carbon gather every box</text></g></svg>
