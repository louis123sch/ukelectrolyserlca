<svg xmlns="http://www.w3.org/2000/svg" width="680" height="640" viewBox="0 0 680 640" role="img" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
<title>Data centre with wind, solar, grid, battery and hydrogen loop</title>
<desc>Wind and solar pass through step-up transformers to a site medium-voltage busbar, which also connects to the GB grid through a grid connection. The busbar feeds a battery, an electrolyser and the data centre; the electrolyser feeds a compressor and hydrogen tank, which also takes bought hydrogen, and the tank feeds a fuel cell that returns electricity to the busbar. The data centre contains IT load, cooling, a UPS battery and a diesel genset.</desc>
<defs>
<marker id="arrow-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#7F77DD" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
  .th { font-size: 14px; font-weight: 500; }
  .ts { font-size: 12px; font-weight: 400; }
  .teal rect   { fill: #E1F5EE; stroke: #0F6E56; }
  .teal .th    { fill: #085041; }  .teal .ts   { fill: #0F6E56; }
  .gray rect   { fill: #F1EFE8; stroke: #5F5E5A; }
  .gray .th    { fill: #444441; }  .gray .ts   { fill: #5F5E5A; }
  .purple rect { fill: #EEEDFE; stroke: #534AB7; }
  .purple .th  { fill: #3C3489; }  .purple .ts { fill: #534AB7; }
  .coral rect  { fill: #FAECE7; stroke: #993C1D; }
  .coral .th   { fill: #712B13; }  .coral .ts  { fill: #993C1D; }
  .arr { fill: none; stroke: #5F5E5A; stroke-width: 1.5; }
  .h2  { fill: none; stroke: #7F77DD; stroke-width: 1.5; stroke-dasharray: 5 4; }
  .legend { font-size: 12px; fill: #5F5E5A; }
</style>
</defs>
<rect x="0" y="0" width="680" height="640" fill="#FFFFFF"/>

<!-- row A: sources -->
<g class="teal">
  <rect x="40" y="40" width="184" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="132" y="58" text-anchor="middle" dominant-baseline="central">Wind farm</text>
  <text class="ts" x="132" y="76" text-anchor="middle" dominant-baseline="central">turbines generate at 690 V</text>
</g>
<g class="teal">
  <rect x="240" y="40" width="184" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="332" y="58" text-anchor="middle" dominant-baseline="central">Solar PV</text>
  <text class="ts" x="332" y="76" text-anchor="middle" dominant-baseline="central">open-ground, DC output</text>
</g>
<g class="gray">
  <rect x="440" y="40" width="184" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="532" y="58" text-anchor="middle" dominant-baseline="central">GB grid</text>
  <text class="ts" x="532" y="76" text-anchor="middle" dominant-baseline="central">HV transmission network</text>
</g>

<line x1="132" y1="96" x2="132" y2="126" class="arr" marker-end="url(#arrow-g)"/>
<line x1="332" y1="96" x2="332" y2="126" class="arr" marker-end="url(#arrow-g)"/>
<line x1="532" y1="96" x2="532" y2="126" class="arr" marker-end="url(#arrow-g)" marker-start="url(#arrow-g)"/>

<!-- row B: electrical balance of plant -->
<g class="gray">
  <rect x="40" y="126" width="184" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="132" y="144" text-anchor="middle" dominant-baseline="central">Turbine transformers</text>
  <text class="ts" x="132" y="162" text-anchor="middle" dominant-baseline="central">one per turbine, 690 V to MV</text>
</g>
<g class="gray">
  <rect x="240" y="126" width="184" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="332" y="144" text-anchor="middle" dominant-baseline="central">Inverter + step-up tx</text>
  <text class="ts" x="332" y="162" text-anchor="middle" dominant-baseline="central">DC to AC, one plant unit</text>
</g>
<g class="gray">
  <rect x="440" y="126" width="184" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="532" y="144" text-anchor="middle" dominant-baseline="central">Grid connection</text>
  <text class="ts" x="532" y="162" text-anchor="middle" dominant-baseline="central">2 supergrid tx + HV line</text>
</g>

<line x1="132" y1="182" x2="132" y2="216" class="arr" marker-end="url(#arrow-g)"/>
<line x1="332" y1="182" x2="332" y2="216" class="arr" marker-end="url(#arrow-g)"/>
<line x1="532" y1="182" x2="532" y2="216" class="arr" marker-end="url(#arrow-g)" marker-start="url(#arrow-g)"/>

<!-- row C: site busbar -->
<g class="gray">
  <rect x="40" y="216" width="584" height="36" rx="4" stroke-width="0.5"/>
  <text class="th" x="332" y="234" text-anchor="middle" dominant-baseline="central">Site medium-voltage busbar, 1–24 kV</text>
</g>

<!-- busbar to row D -->
<line x1="104" y1="252" x2="104" y2="300" class="arr" marker-end="url(#arrow-g)" marker-start="url(#arrow-g)"/>
<line x1="248" y1="252" x2="248" y2="300" class="arr" marker-end="url(#arrow-g)"/>
<line x1="392" y1="300" x2="392" y2="252" class="arr" marker-end="url(#arrow-g)"/>
<line x1="552" y1="252" x2="552" y2="300" class="arr" marker-end="url(#arrow-g)"/>

<!-- row D -->
<g class="gray">
  <rect x="40" y="300" width="128" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="104" y="318" text-anchor="middle" dominant-baseline="central">Battery</text>
  <text class="ts" x="104" y="336" text-anchor="middle" dominant-baseline="central">LFP pack, inverter</text>
</g>
<g class="purple">
  <rect x="184" y="300" width="128" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="248" y="318" text-anchor="middle" dominant-baseline="central">Electrolyser</text>
  <text class="ts" x="248" y="336" text-anchor="middle" dominant-baseline="central">PEM, ~30 bar out</text>
</g>
<g class="purple">
  <rect x="328" y="300" width="128" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="392" y="318" text-anchor="middle" dominant-baseline="central">Fuel cell</text>
  <text class="ts" x="392" y="336" text-anchor="middle" dominant-baseline="central">PEM stack + BoP</text>
</g>

<!-- data centre container -->
<g class="coral">
  <rect x="472" y="300" width="160" height="276" rx="12" stroke-width="0.5"/>
  <text class="th" x="552" y="322" text-anchor="middle" dominant-baseline="central">Data centre</text>
  <text class="ts" x="552" y="340" text-anchor="middle" dominant-baseline="central">7.31 MW draw, PUE 1.4</text>
</g>
<g class="gray">
  <rect x="492" y="356" width="120" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="552" y="378" text-anchor="middle" dominant-baseline="central">IT load 5.2 MW</text>
</g>
<g class="gray">
  <rect x="492" y="408" width="120" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="552" y="430" text-anchor="middle" dominant-baseline="central">Cooling and aux</text>
</g>
<g class="gray">
  <rect x="492" y="460" width="120" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="552" y="482" text-anchor="middle" dominant-baseline="central">UPS battery</text>
</g>
<g class="gray">
  <rect x="492" y="512" width="120" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="552" y="534" text-anchor="middle" dominant-baseline="central">Diesel genset</text>
</g>

<!-- hydrogen flows -->
<line x1="240" y1="356" x2="240" y2="404" class="h2" marker-end="url(#arrow-p)"/>
<line x1="296" y1="432" x2="328" y2="432" class="h2" marker-end="url(#arrow-p)"/>
<line x1="392" y1="404" x2="392" y2="356" class="h2" marker-end="url(#arrow-p)"/>
<path d="M104 460 L104 484 L392 484 L392 460" class="h2" marker-end="url(#arrow-p)"/>

<!-- row E: hydrogen chain -->
<g class="purple">
  <rect x="40" y="404" width="128" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="104" y="422" text-anchor="middle" dominant-baseline="central">Bought hydrogen</text>
  <text class="ts" x="104" y="440" text-anchor="middle" dominant-baseline="central">trailer at 200 bar</text>
</g>
<g class="purple">
  <rect x="184" y="404" width="112" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="240" y="422" text-anchor="middle" dominant-baseline="central">Compressor</text>
  <text class="ts" x="240" y="440" text-anchor="middle" dominant-baseline="central">if 200 bar tank</text>
</g>
<g class="purple">
  <rect x="328" y="404" width="128" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="392" y="422" text-anchor="middle" dominant-baseline="central">H2 tank</text>
  <text class="ts" x="392" y="440" text-anchor="middle" dominant-baseline="central">steel, 28/200 bar</text>
</g>

<!-- legend -->
<line x1="40" y1="608" x2="80" y2="608" class="arr" marker-end="url(#arrow-g)"/>
<text class="legend" x="90" y="608" dominant-baseline="central">electricity</text>
<line x1="190" y1="608" x2="230" y2="608" class="h2" marker-end="url(#arrow-p)"/>
<text class="legend" x="240" y="608" dominant-baseline="central">hydrogen</text>
</svg>
