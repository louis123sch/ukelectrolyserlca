# The Python setup for running the model on Imperial's cluster (CX3, Linux).
# It copies the laptop's "brightway" conda environment, pinned to the versions
# in use there on 17 Nov 2026, without the notebook and web-page tools.
#
# On the cluster, once (Imperial's conda guide: their miniforge, conda-forge only,
# because Anaconda's licence rules out its "defaults" channel):
#   module load miniforge/3
#   miniforge-setup
#   eval "$(~/miniforge3/bin/conda shell.bash hook)"
#   conda config --remove channels defaults
#   conda config --add channels conda-forge
#   conda env create -f environment-cluster.yml
#   conda activate ukdclca
#
# This branch's Brightway project is hydrogen-smr-sources: set DC_BW_PROJECT to it in
# every job, as scripts/weekend_queue.py does on the laptop.
#
# Gurobi: Imperial's licence server (gurobi.cc.ic.ac.uk, 4,096 places, checked 17 Nov
# 2026) covers the cluster; the newest Gurobi it offers is 13.0.1, so gurobipy is pinned
# to 13.0.1 here (the laptop runs 14). Every job points at the licence with
#   export GRB_LICENSE_FILE=/sw-eb/software/Gurobi/13.0.1-GCCcore-14.3.0/gurobi.lic
# (what "module load Gurobi/13.0.1-GCCcore-14.3.0" sets). DC_SOLVER=highs still works.
name: ukdclca
channels:
  - conda-forge
dependencies:
  - python=3.12
  - brightway25=1.1.1
  - bw2data=4.7
  - bw2calc=2.4.0
  - bw2io=0.9.17
  - numpy=1.26.4
  - pandas=2.3.3
  - scipy=1.17.1
  - xarray=2026.4.0
  - pypardiso=0.4.7
  - openpyxl=3.1.5
  - xlsxwriter=3.2.9
  - requests=2.34.2
  - python-dotenv=1.2.2
  - matplotlib=3.9.1
  - tqdm
  - pytest
  - pip
  - pip:
      - linopy==0.9.1
      - highspy==1.15.1
      - gurobipy==13.0.1
